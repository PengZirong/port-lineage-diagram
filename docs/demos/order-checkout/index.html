function trace(target){
 const refs=new Set(),roots=new Set(),unknown=new Set(),edges=new Set();
 function visit(ref){if(refs.has(ref))return;refs.add(ref);const f=FIELDS.get(ref);if(f.origin)roots.add(ref);if(f.op==='unknown')unknown.add(ref);for(const d of DEPS(f)){edges.add(edgeKey(d.ref,ref,d.role,d.when||''));visit(d.ref);}}
 visit(target);return{refs,roots,unknown,edges};
}
function rootRoles(target){
 const roles=new Map(),visited=new Set();
 function visit(ref,role){const key=ref+'|'+role;if(visited.has(key))return;visited.add(key);const f=FIELDS.get(ref);if(f.origin){if(!roles.has(ref))roles.set(ref,new Set());roles.get(ref).add(role);}for(const d of DEPS(f)){const next=role==='value'?d.role:role;visit(d.ref,next);}}
 visit(target,'value');return roles;
}
function setMode(next){mode=next;for(const b of document.querySelectorAll('[data-mode]')){b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode));}update();}
function update(){
 const t=trace(selected);
 for(const e of document.querySelectorAll('.dep')){const on=t.edges.has(edgeKey(e.dataset.source,e.dataset.target,e.dataset.role,e.dataset.when||''));e.classList.toggle('on',mode==='focus'&&on);e.classList.toggle('dim',mode==='focus'&&!on);}
 for(const row of document.querySelectorAll('.field')){row.classList.toggle('selected',row.dataset.field===selected);row.classList.toggle('dim',mode==='focus'&&!t.refs.has(row.dataset.field));row.setAttribute('aria-pressed',String(row.dataset.field===selected));}
 $('dependency-edges').style.display=mode==='flow'?'none':'';$('flow-edges').style.display=mode==='flow'?'':'none';
 for(const b of document.querySelectorAll('#quick button'))b.classList.toggle('active',b.dataset.ref===selected);
 document.documentElement.dataset.mode=mode;document.documentElement.dataset.selected=selected;
}
function select(ref,focus=true){
 if(!FIELDS.has(ref))return;selected=ref;const f=FIELDS.get(ref),t=trace(ref),roles=rootRoles(ref);
 $('field-label').textContent=f.label;$('field-ref').textContent=ref;$('field-meta').textContent=f.type+' · '+OP[f.op];
 $('field-value').replaceChildren();
 if(Object.hasOwn(f,'sample')){const span=document.createElement('span');span.textContent='示例值：';const b=document.createElement('b');b.textContent=typeof f.sample==='number'&&f.type.endsWith('/分')?(f.sample/100).toFixed(2)+' 元（'+f.sample.toLocaleString('en-US')+' 分）':typeof f.sample==='object'?JSON.stringify(f.sample):String(f.sample);$('field-value').append(span,b);}
 $('rule').textContent=f.rule||(f.op==='root'?'读取 '+f.origin.locator:f.op==='unknown'?'尚未确认，不推测来源':f.op==='rename'?'保持原值，仅调整名称':'原样传递，不重新生成');
 $('field-note').textContent=f.note||'';
 const deps=DEPS(f);$('deps').innerHTML=deps.length?deps.map(d=>{const p=FIELDS.get(d.ref);return `<li><button data-ref="${esc(d.ref)}">${esc(NODES.get(p.node).label)} · ${esc(p.label)}</button><span class="role">${ROLE[d.role]}</span><code>${esc(d.ref)}</code>${d.when?`<span class="subtle">条件：${esc(d.when)}</span>`:''}</li>`;}).join(''):'<li class="subtle">'+(f.origin?'合法根来源，无上游字段。':'尚未确认上游依赖。')+'</li>';
 $('roots').innerHTML=[...t.roots].map(r=>{const p=FIELDS.get(r);return `<li><button data-ref="${esc(r)}">${esc(p.label)}</button><span class="role">${[...roles.get(r)].map(x=>ROLE[x]).join(' / ')}</span><code>${esc(p.origin.kind)} · ${esc(p.origin.locator)}</code></li>`;}).join('');
 $('unknown').textContent=t.unknown.size?'仍有 '+t.unknown.size+' 个来源待确认：'+[...t.unknown].join('、'):'';
 $('evidence').textContent=MODEL.mode==='example'?'构造案例，用于说明图形与规则；“来源已定义”不代表已验证真实代码。':f.status==='verified'?'已标记代码验证：'+f.evidence:'当前为声明 / 设计关系，尚未完成代码验证。'+(f.evidence?' 依据：'+f.evidence:'');
 $('source-status').textContent=t.unknown.size?'待确认':MODEL.mode==='example'?'示例定义':'已记录';
 if(focus)setMode('focus');else update();if(innerWidth<780)revealSelected();
}
function fitWidth(){zoom=Math.max(innerWidth<780?.8:.15,($('canvas').clientWidth-24)/REPORT.geometry.width);applyZoom();}
function revealSelected(){const f=FIELDS.get(selected),box=REPORT.geometry.boxes[f.node],port=REPORT.geometry.ports[selected],canvas=$('canvas');canvas.scrollLeft=Math.max(0,(box.x-12)*zoom);canvas.scrollTop=Math.max(0,(port.y-120)*zoom);}
function applyZoom(){const svg=$('lineage-svg');svg.style.width=(REPORT.geometry.width*zoom)+'px';svg.style.height=(REPORT.geometry.height*zoom)+'px';$('svg-wrap').style.width=(REPORT.geometry.width*zoom)+'px';$('zoom-label').textContent=Math.round(zoom*100)+'%';if(innerWidth<780)revealSelected();}
function download(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('title').textContent=MODEL.title;$('subtitle').textContent=MODEL.subtitle||'';
$('node-count').textContent=REPORT.nodes;$('output-count').textContent=REPORT.outputs.length;$('coverage').textContent=REPORT.covered_outputs.length+'/'+REPORT.outputs.length;
$('coverage-label').textContent=MODEL.mode==='example'?'示例来源已定义':'来源已定义（非验证率）';
$('quick').innerHTML=REPORT.outputs.map(ref=>`<button type="button" data-ref="${esc(ref)}">${esc(FIELDS.get(ref).label)}</button>`).join('');
$('scope').textContent=MODEL.scope||'点击任一字段查看完整来源；同名字段不会被自动当成同一个字段。';
$('assumptions').textContent=(MODEL.assumptions||[]).join('；');
$('warnings').textContent=REPORT.warnings.length?'校验提示：'+REPORT.warnings.join('；'):'结构校验：依赖引用、输出来源、数据循环和节点重叠检查通过。';
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>setMode(b.dataset.mode));
document.addEventListener('click',e=>{const refButton=e.target.closest('[data-ref]');if(refButton){select(refButton.dataset.ref);return;}const row=e.target.closest('.field');if(row)select(row.dataset.field);});
document.addEventListener('keydown',e=>{if(e.target.closest('.field')&&['Enter',' '].includes(e.key)){e.preventDefault();select(e.target.closest('.field').dataset.field);}});
$('search').addEventListener('input',e=>{const query=e.target.value.trim().toLowerCase();const result=[...FIELDS.values()].filter(f=>[f.ref,f.label,NODES.get(f.node).label].some(x=>x.toLowerCase().includes(query)));$('search-list').innerHTML=query?(result.length?result.slice(0,40).map(f=>`<button data-ref="${esc(f.ref)}">${esc(NODES.get(f.node).label)} / ${esc(f.label)}<br>${esc(f.ref)}</button>`).join(''):'<div class="subtle" style="padding:8px">没有匹配字段</div>'):'';});
$('fit').addEventListener('click',fitWidth);$('zoom-in').addEventListener('click',()=>{zoom=Math.min(2.5,zoom*1.2);applyZoom();});$('zoom-out').addEventListener('click',()=>{zoom=Math.max(.15,zoom/1.2);applyZoom();});
$('export-json').addEventListener('click',()=>download('lineage.model.json',JSON.stringify(MODEL,null,2),'application/json;charset=utf-8'));
$('export-svg').addEventListener('click',()=>{const clone=$('lineage-svg').cloneNode(true);clone.removeAttribute('style');clone.setAttribute('width',REPORT.geometry.width);clone.setAttribute('height',REPORT.geometry.height);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');download('lineage.svg',new XMLSerializer().serializeToString(clone),'image/svg+xml;charset=utf-8');});
window.lineage={select,setMode,trace:ref=>{const t=trace(ref);return{fields:[...t.refs],roots:[...t.roots],unknown:[...t.unknown],edges:[...t.edges]};},model:MODEL,report:REPORT,fitWidth};
select(selected,false);fitWidth();document.fonts.ready.then(()=>{fitWidth();document.documentElement.dataset.ready='true';});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitWidth,150);});
</script>
