<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--ink:#243C57;--muted:#7B8EA5;--line:#E1E8F0;--blue:#3976CF;--paper:#FFF;--bg:#F3F6FA}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.shell{max-width:2400px;margin:auto;padding:25px 28px 20px}.head{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;align-items:center}.eyebrow{color:#4C79B5;font-size:10px;font-weight:800;letter-spacing:.15em;margin-bottom:8px}h1{margin:0 0 8px;font-size:26px;letter-spacing:-.025em}p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.counts{display:flex;gap:10px;flex-shrink:0}.count{padding:12px 17px;background:#fff;border:1px solid var(--line);border-radius:11px;min-width:103px}.count b{display:block;font-size:22px}.count span{font-size:10px;color:var(--muted)}.workspace{border:1px solid var(--line);border-radius:16px;background:white;overflow:hidden;box-shadow:0 8px 25px #29486B06}.toolbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.segments{display:flex;gap:3px;border:1px solid var(--line);border-radius:8px;background:#F4F7FA;padding:3px}.segments button{border:0;background:none;color:#8090A4;padding:6px 12px;font-size:11px;border-radius:5px}.segments button.active{background:white;color:#306BC0;box-shadow:0 1px 5px #18395316;font-weight:700}.btn{border:1px solid var(--line);background:white;color:#536C89;border-radius:7px;padding:7px 10px;font-size:11px;white-space:nowrap}.btn:hover{border-color:#89ABD4;background:#F7FAFF}.zoom{font-size:10px;color:var(--muted);min-width:37px;text-align:center}.body{display:grid;grid-template-columns:minmax(0,1fr) 318px;align-items:stretch}.canvas{overflow:auto;background:#FAFCFF;min-width:0;padding:12px;max-height:calc(100vh - 230px);min-height:570px;overscroll-behavior:contain}.svg-wrap{width:100%;min-height:300px;line-height:0;transform-origin:top left}.svg-wrap svg{display:block;max-width:none;height:auto;touch-action:pan-x pan-y}.inspector{border-left:1px solid var(--line);background:white;padding:17px;max-height:calc(100vh - 230px);overflow:auto}.inspector-title{font-size:12px;display:flex;justify-content:space-between;align-items:center}.search{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:11px;color:#304D6B;margin:12px 0 8px;background:#F9FBFE}.search-list:empty{display:none}.search-list{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-bottom:10px}.search-list button{width:100%;background:white;border:0;border-bottom:1px solid #EDF1F6;padding:7px 9px;text-align:left;font-size:10px;color:#54708F}.quick-title{font-size:10px;color:#8999AB;margin:8px 0}.quick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}.quick button{font-size:10px;padding:6px 8px;border:1px solid #DCE6F1;border-radius:6px;color:#647C99;background:#F9FBFE}.quick button.active{border-color:#D7AE75;background:#FFF5E8;color:#A2702D}.selected-card{background:#F7FAFD;border:1px solid #E0E9F3;border-radius:10px;padding:13px;line-height:1.6}.selected-card h2{font-size:18px;letter-spacing:-.02em;margin:0 0 3px}.ref{font-size:11px;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#587492}.meta{font-size:10px;color:#8194AC;margin:4px 0}.value{margin-top:9px;font-size:11px}.value b{font-size:16px;color:#AE772C;overflow-wrap:anywhere}.section{margin-top:16px}.section h3{font-size:11px;margin:0 0 8px;color:#55708F}.formula{font-size:11px;line-height:1.7;border-radius:7px;background:#F5F8FC;border:1px solid #E5ECF5;padding:9px 10px;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.subtle{font-size:10px;line-height:1.75;color:#8598AD}.dep-list,.root-list{list-style:none;margin:0;padding:0}.dep-list li{padding:8px 0;border-bottom:1px solid #EEF2F7;line-height:1.5;font-size:11px}.dep-list button,.root-list button{background:none;border:0;padding:0;text-align:left;color:#326CAF;font-size:11px}.dep-list code{display:block;font-size:9px;color:#8094AE;overflow-wrap:anywhere}.role{font-size:9px;color:#8796AC;margin-left:5px}.root-list li{font-size:10px;line-height:1.6;margin-bottom:8px;padding-left:10px;border-left:2px solid #BED8ED}.root-list code{display:block;color:#8999AC;font-size:9px;overflow-wrap:anywhere}.note{font-size:10px;color:#7C91A9;line-height:1.8;margin:9px 0}.warning{color:#B84B58}.legend{border-top:1px solid var(--line);padding:12px 17px;display:flex;gap:21px;flex-wrap:wrap;font-size:10px;color:#71879E;align-items:center}.swatch{display:inline-block;width:23px;height:2px;vertical-align:middle;margin-right:6px;background:var(--c)}.swatch.dash{height:0;border-top:2px dashed var(--c);background:none}.bottom{display:flex;justify-content:space-between;gap:16px;font-size:10px;color:#8193AA;line-height:1.8;padding:12px 3px 0}.bottom details{max-width:50%;cursor:pointer}.bottom summary{color:#6D829A}.status{font-size:10px;color:#66829C}.pill{background:#EAF5F0;color:#29846A;padding:5px 8px;border-radius:20px;font-size:10px;white-space:nowrap}#fallback{padding:30px;font-size:16px;color:#A53E4B}.drop-marker{color:#C34F60}
@media(min-width:2100px){.canvas,.inspector{max-height:1200px}}@media(max-width:1200px){.shell{padding:16px}.body{grid-template-columns:minmax(0,1fr) 280px}.counts .count:first-child{display:none}.count{min-width:90px;padding:10px 12px}}
@media(max-width:780px){.shell{padding:12px}.head{align-items:start}.counts{display:none}h1{font-size:21px}.body{grid-template-columns:1fr}.inspector{border-left:0;border-top:1px solid var(--line);max-height:none}.canvas{max-height:68vh;min-height:330px}.toolbar{padding:10px}.segments button{padding:6px 8px;font-size:10px}.bottom{display:block}.bottom details{max-width:100%}.legend{gap:12px}.toolbar-right{gap:5px}.toolbar-right .btn{font-size:10px}.quick button{font-size:11px}}
@media print{.shell{padding:0}.toolbar,.inspector,.bottom{display:none}.body{display:block}.canvas{max-height:none;padding:0;overflow:visible}.counts{display:none}.workspace{border:0}.head h1{font-size:22px}.svg-wrap svg{width:100%!important}.dep.dim{opacity:.65!important}.field.dim{opacity:1!important}}
</style>
</head>
<body>
<div class="shell">
<header class="head"><div><div class="eyebrow">PORT-BASED DATAFLOW · REUSABLE SKILL EXAMPLE</div><h1 id="title">__TITLE__</h1><p id="subtitle"></p></div><div class="counts"><div class="count"><b id="node-count"></b><span>同图流程节点</span></div><div class="count"><b id="output-count"></b><span>输出字段</span></div><div class="count"><b id="coverage"></b><span id="coverage-label">来源已定义</span></div></div></header>
<main class="workspace">
<div class="toolbar"><div class="toolbar-left"><span class="pill">流程 + 字段来源</span><div class="segments"><button type="button" data-mode="all" class="active">全部血缘</button><button type="button" data-mode="focus">聚焦字段</button><button type="button" data-mode="flow">流程骨架</button></div></div><div class="toolbar-right"><button type="button" class="btn" id="fit">适配视图</button><button type="button" class="btn" id="zoom-out" aria-label="缩小">−</button><span class="zoom" id="zoom-label"></span><button type="button" class="btn" id="zoom-in" aria-label="放大">+</button><button type="button" class="btn" id="export-svg">导出 SVG</button><button type="button" class="btn" id="export-json">导出模型</button></div></div>
<div class="body"><section class="canvas" id="canvas" aria-label="可缩放的流程字段一体图"><div class="svg-wrap" id="svg-wrap">__SVG__</div></section><aside class="inspector" aria-label="选中字段说明"><div class="inspector-title"><b>字段来源</b><span class="status" id="source-status"></span></div><input id="search" class="search" type="search" placeholder="搜索中文字段或节点.字段名" aria-label="搜索字段"><div class="search-list" id="search-list"></div><div class="quick-title">最终输出 · 点击追踪来源</div><div class="quick" id="quick"></div><section class="selected-card" aria-live="polite"><h2 id="field-label"></h2><div class="ref" id="field-ref"></div><div class="meta" id="field-meta"></div><div class="value" id="field-value"></div></section><section class="section"><h3>生成或传递规则</h3><div class="formula" id="rule"></div><p class="note" id="field-note"></p></section><section class="section"><h3>直接依赖 · 不省略任何来源</h3><ul class="dep-list" id="deps"></ul></section><section class="section"><h3>最初来源</h3><ul class="root-list" id="roots"></ul><p class="note warning" id="unknown"></p></section><section class="section"><h3>证据状态</h3><p class="subtle" id="evidence"></p></section></aside></div>
<div class="legend"><span><i class="swatch" style="--c:#3976CF"></i>透传 / 原始取值</span><span><i class="swatch" style="--c:#199681"></i>类型转换 / 规范化</span><span><i class="swatch" style="--c:#D38727"></i>计算 / 汇合派生</span><span><i class="swatch" style="--c:#9162C9"></i>查表 / 配置取值</span><span><i class="swatch dash" style="--c:#9162C9"></i>选择键（不直接提供值）</span><span>箭头方向：来源 → 依赖它的输出字段</span></div>
</main>
<footer class="bottom"><span id="scope"></span><details><summary>示例边界与校验结果</summary><div id="assumptions"></div><div id="warnings"></div></details></footer>
</div>
<script id="model" type="application/json">__MODEL_JSON__</script>
<script id="report" type="application/json">__REPORT_JSON__</script>
<script>
'use strict';
const MODEL=JSON.parse(document.getElementById('model').textContent);
const REPORT=JSON.parse(document.getElementById('report').textContent);
const $=id=>document.getElementById(id);
const FIELDS=new Map(),NODES=new Map();
for(const n of MODEL.nodes){NODES.set(n.id,n);for(const f of n.fields){const ref=n.id+'.'+f.id;FIELDS.set(ref,{...f,ref,node:n.id});}}
const DEPS=f=>(f.from||[]).map(d=>typeof d==='string'?{ref:d,role:'value'}:{role:'value',...d});
const OP={root:'源字段',identity:'原样透传',rename:'重命名',cast:'类型转换',normalize:'规范化',derive:'计算生成',lookup:'查表',aggregate:'聚合',choose:'条件择支',unknown:'来源待确认'};
const ROLE={value:'值依赖',selector:'选择键',condition:'条件依赖'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=MODEL.default_field||REPORT.outputs.at(-1),mode='all',zoom=1;
const edgeKey=(a,b,role,when='')=>JSON.stringify([a,b,role,when]);
function trace(target){
 const refs=new Set(),roots=new Set(),unknown=new Set(),edges=new Set();
 function visit(ref){if(refs.has(ref))return;refs.add(ref);const f=FIELDS.get(ref);if(f.origin)roots.add(ref);if(f.op==='unknown')unknown.add(ref);for(const d of DEPS(f)){edges.add(edgeKey(d.ref,ref,d.role,d.when||''));visit(d.ref);}}
 visit(target);return{refs,roots,unknown,edges};
}
function rootRoles(target){
 const roles=new Map(),visited=new Set();
 function visit(ref,role){const key=ref+'|'+role;if(visited.has(key))return;visited.add(key);const f=FIELDS.get(ref);if(f.origin){if(!roles.has(ref))roles.set(ref,new Set());roles.get(ref).add(role);}for(const d of DEPS(f)){const next=role==='value'?d.role:role;visit(d.ref,next);}}
 visit(target,'value');return roles;
}
function setMode(next){mode=next;for(const b of document.querySelectorAll('[data-mode]')){b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode));}update();}
function update(){
 const t=trace(selected);
 for(const e of document.querySelectorAll('.dep')){const on=t.edges.has(edgeKey(e.dataset.source,e.dataset.target,e.dataset.role,e.dataset.when||''));e.classList.toggle('on',mode==='focus'&&on);e.classList.toggle('dim',mode==='focus'&&!on);}
 for(const row of document.querySelectorAll('.field')){row.classList.toggle('selected',row.dataset.field===selected);row.classList.toggle('dim',mode==='focus'&&!t.refs.has(row.dataset.field));row.setAttribute('aria-pressed',String(row.dataset.field===selected));}
 $('dependency-edges').style.display=mode==='flow'?'none':'';$('flow-edges').style.display=mode==='flow'?'':'none';
 for(const b of document.querySelectorAll('#quick button'))b.classList.toggle('active',b.dataset.ref===selected);
 document.documentElement.dataset.mode=mode;document.documentElement.dataset.selected=selected;
}
function select(ref,focus=true){
 if(!FIELDS.has(ref))return;selected=ref;const f=FIELDS.get(ref),t=trace(ref),roles=rootRoles(ref);
 $('field-label').textContent=f.label;$('field-ref').textContent=ref;$('field-meta').textContent=f.type+' · '+OP[f.op];
 $('field-value').replaceChildren();
 if(Object.hasOwn(f,'sample')){const span=document.createElement('span');span.textContent='示例值：';const b=document.createElement('b');b.textContent=typeof f.sample==='number'&&f.type.endsWith('/分')?(f.sample/100).toFixed(2)+' 元（'+f.sample.toLocaleString('en-US')+' 分）':typeof f.sample==='object'?JSON.stringify(f.sample):String(f.sample);$('field-value').append(span,b);}
 $('rule').textContent=f.rule||(f.op==='root'?'读取 '+f.origin.locator:f.op==='unknown'?'尚未确认，不推测来源':f.op==='rename'?'保持原值，仅调整名称':'原样传递，不重新生成');
 $('field-note').textContent=f.note||'';
 const deps=DEPS(f);$('deps').innerHTML=deps.length?deps.map(d=>{const p=FIELDS.get(d.ref);return `<li><button data-ref="${esc(d.ref)}">${esc(NODES.get(p.node).label)} · ${esc(p.label)}</button><span class="role">${ROLE[d.role]}</span><code>${esc(d.ref)}</code>${d.when?`<span class="subtle">条件：${esc(d.when)}</span>`:''}</li>`;}).join(''):'<li class="subtle">'+(f.origin?'合法根来源，无上游字段。':'尚未确认上游依赖。')+'</li>';
 $('roots').innerHTML=[...t.roots].map(r=>{const p=FIELDS.get(r);return `<li><button data-ref="${esc(r)}">${esc(p.label)}</button><span class="role">${[...roles.get(r)].map(x=>ROLE[x]).join(' / ')}</span><code>${esc(p.origin.kind)} · ${esc(p.origin.locator)}</code></li>`;}).join('');
 $('unknown').textContent=t.unknown.size?'仍有 '+t.unknown.size+' 个来源待确认：'+[...t.unknown].join('、'):'';
 $('evidence').textContent=MODEL.mode==='example'?'构造案例，用于说明图形与规则；“来源已定义”不代表已验证真实代码。':f.status==='verified'?'已标记代码验证：'+f.evidence:'当前为声明 / 设计关系，尚未完成代码验证。'+(f.evidence?' 依据：'+f.evidence:'');
 $('source-status').textContent=t.unknown.size?'待确认':MODEL.mode==='example'?'示例定义':'已记录';
 if(focus)setMode('focus');else update();if(innerWidth<780)revealSelected();
}
function fitWidth(){zoom=Math.max(innerWidth<780?.8:.15,($('canvas').clientWidth-24)/REPORT.geometry.width);applyZoom();}
function revealSelected(){const f=FIELDS.get(selected),box=REPORT.geometry.boxes[f.node],port=REPORT.geometry.ports[selected],canvas=$('canvas');canvas.scrollLeft=Math.max(0,(box.x-12)*zoom);canvas.scrollTop=Math.max(0,(port.y-120)*zoom);}
function applyZoom(){const svg=$('lineage-svg');svg.style.width=(REPORT.geometry.width*zoom)+'px';svg.style.height=(REPORT.geometry.height*zoom)+'px';$('svg-wrap').style.width=(REPORT.geometry.width*zoom)+'px';$('zoom-label').textContent=Math.round(zoom*100)+'%';if(innerWidth<780)revealSelected();}
function download(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('title').textContent=MODEL.title;$('subtitle').textContent=MODEL.subtitle||'';
$('node-count').textContent=REPORT.nodes;$('output-count').textContent=REPORT.outputs.length;$('coverage').textContent=REPORT.covered_outputs.length+'/'+REPORT.outputs.length;
$('coverage-label').textContent=MODEL.mode==='example'?'示例来源已定义':'来源已定义（非验证率）';
$('quick').innerHTML=REPORT.outputs.map(ref=>`<button type="button" data-ref="${esc(ref)}">${esc(FIELDS.get(ref).label)}</button>`).join('');
$('scope').textContent=MODEL.scope||'点击任一字段查看完整来源；同名字段不会被自动当成同一个字段。';
$('assumptions').textContent=(MODEL.assumptions||[]).join('；');
$('warnings').textContent=REPORT.warnings.length?'校验提示：'+REPORT.warnings.join('；'):'结构校验：依赖引用、输出来源、数据循环和节点重叠检查通过。';
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>setMode(b.dataset.mode));
document.addEventListener('click',e=>{const refButton=e.target.closest('[data-ref]');if(refButton){select(refButton.dataset.ref);return;}const row=e.target.closest('.field');if(row)select(row.dataset.field);});
document.addEventListener('keydown',e=>{if(e.target.closest('.field')&&['Enter',' '].includes(e.key)){e.preventDefault();select(e.target.closest('.field').dataset.field);}});
$('search').addEventListener('input',e=>{const query=e.target.value.trim().toLowerCase();const result=[...FIELDS.values()].filter(f=>[f.ref,f.label,NODES.get(f.node).label].some(x=>x.toLowerCase().includes(query)));$('search-list').innerHTML=query?(result.length?result.slice(0,40).map(f=>`<button data-ref="${esc(f.ref)}">${esc(NODES.get(f.node).label)} / ${esc(f.label)}<br>${esc(f.ref)}</button>`).join(''):'<div class="subtle" style="padding:8px">没有匹配字段</div>'):'';});
$('fit').addEventListener('click',fitWidth);$('zoom-in').addEventListener('click',()=>{zoom=Math.min(2.5,zoom*1.2);applyZoom();});$('zoom-out').addEventListener('click',()=>{zoom=Math.max(.15,zoom/1.2);applyZoom();});
$('export-json').addEventListener('click',()=>download('lineage.model.json',JSON.stringify(MODEL,null,2),'application/json;charset=utf-8'));
$('export-svg').addEventListener('click',()=>{const clone=$('lineage-svg').cloneNode(true);clone.removeAttribute('style');clone.setAttribute('width',REPORT.geometry.width);clone.setAttribute('height',REPORT.geometry.height);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');download('lineage.svg',new XMLSerializer().serializeToString(clone),'image/svg+xml;charset=utf-8');});
window.lineage={select,setMode,trace:ref=>{const t=trace(ref);return{fields:[...t.refs],roots:[...t.roots],unknown:[...t.unknown],edges:[...t.edges]};},model:MODEL,report:REPORT,fitWidth};
select(selected,false);fitWidth();document.fonts.ready.then(()=>{fitWidth();document.documentElement.dataset.ready='true';});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitWidth,150);});
</script>
<noscript><div id="fallback">当前浏览器未启用 JavaScript。上方仍是完整静态 SVG，字段选择与缩放功能不可用。</div></noscript>
</body>
</html>
